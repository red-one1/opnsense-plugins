# Custom BIND Configuration Directory
#
# Place your custom BIND directives in .conf files in this directory
# Files are included in alphabetical order
#
# Examples:
# server 192.168.1.100 { edns no; };
#
# A custom DNSSEC policy for the "DNSSEC Policy" setting of a zone (the built-in
# "default" policy needs no file). The name must match the zone setting:
# dnssec-policy "mypolicy" {
#     keys {
#         ksk lifetime unlimited algorithm ecdsap256sha256;
#         zsk lifetime 90d algorithm ecdsap256sha256;
#     };
# };
